name: Build Varnix AI Signed APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, varnix-v3-foundation]

concurrency:
  group: varnix-v3-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then echo "Missing required secret: $name"; exit 1; fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/varnix-release.jks
          test -s android/app/varnix-release.jks
          {
            printf 'storePassword=%s\\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=app/varnix-release.jks\\n'
          } > android/key.properties
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - name: Build release APK
        run: |
          flutter build apk --release \\
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \\
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
      - name: Verify APK signature
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: varnix-ai-signed-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
