name: Build Varnix AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - feat/cloud-sync-and-owner-api-keys
      - feat/multipage-navigation-referrals
      - feat/permission-onboarding-file-access
      - feat/varnix-content-terms-updates
      - feat/android9-apk-size-optimization
      - feature/multipage-myket-billing
  pull_request:
    branches:
      - main
      - master
      - feat/cloud-sync-and-owner-api-keys
      - feat/multipage-navigation-referrals
      - feat/permission-onboarding-file-access
      - feat/varnix-content-terms-updates
      - feat/android9-apk-size-optimization

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Get Dependencies
        run: flutter pub get
      - name: Analyze Project
        run: flutter analyze --no-fatal-infos
      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Generate Gradle Wrapper 8.14.3
        run: gradle -p android wrapper --gradle-version 8.14.3 --distribution-type bin
      - name: Build Debug APK for Android verification
        env:
          MYKET_RSA_KEY: ${{ secrets.MYKET_RSA_KEY }}
        run: flutter build apk --debug
      - name: Upload Debug APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: varnix-ai-debug-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Get Dependencies
        run: flutter pub get
      - name: Require release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MYKET_RSA_KEY: ${{ secrets.MYKET_RSA_KEY }}
        run: |
          set -euo pipefail
          test -n "$MYKET_RSA_KEY" || { echo "Missing MYKET_RSA_KEY secret"; exit 1; }
          test -n "$KEYSTORE_BASE64" || { echo "Missing KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing STORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS secret"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          test -s android/app/release-key.jks
          keytool -list -keystore android/app/release-key.jks -storepass "$STORE_PASSWORD" >/dev/null
      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Generate Gradle Wrapper 8.14.3
        run: gradle -p android wrapper --gradle-version 8.14.3 --distribution-type bin
      - name: Build signed ABI-specific Release APKs
        env:
          KEYSTORE_PATH: release-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MYKET_RSA_KEY: ${{ secrets.MYKET_RSA_KEY }}
        run: |
          set -euo pipefail
          mkdir -p dist
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/*-release.apk dist/
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk dist/varnix-universal-release.apk
      - name: Verify all APK signatures
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER"
          for APK in dist/*.apk; do
            test -s "$APK"
            "$APKSIGNER" verify --verbose "$APK"
          done
      - name: Upload optimized signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: varnix-ai-optimized-release-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error
