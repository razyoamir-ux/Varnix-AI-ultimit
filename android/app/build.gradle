plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')

if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '2.0.1'

def releaseStoreFile = System.getenv('KEYSTORE_PATH') ?: 'release-key.jks'
def releaseStorePassword = System.getenv('STORE_PASSWORD')
def releaseKeyAlias = System.getenv('KEY_ALIAS')
def releaseKeyPassword = System.getenv('KEY_PASSWORD')
def releaseKeyFile = file(releaseStoreFile)
def myketRsaKey = System.getenv('MYKET_RSA_KEY') ?: ''
def hasReleaseKey = releaseStorePassword && releaseKeyAlias && releaseKeyPassword && releaseKeyFile.exists() && releaseKeyFile.length() > 0

if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') } && !hasReleaseKey) {
    throw new GradleException('Release build blocked: provide a valid release keystore and KEYSTORE_PATH, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD. Debug signing is never used for release builds.')
}

android {
    namespace "com.varnix.ai.ultimateplus"
    compileSdk 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.varnix.ai.ultimateplus"
        minSdk 28
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        def marketApplicationId = "ir.mservices.market"
        def marketBindAddress = "ir.mservices.market.InAppBillingService.BIND"
        manifestPlaceholders += [
            marketApplicationId: "${marketApplicationId}",
            marketBindAddress  : "${marketBindAddress}",
            marketPermission   : "${marketApplicationId}.BILLING"
        ]
        buildConfigField "String", "MYKET_RSA_KEY", "\"\${myketRsaKey}\""
    }

    buildFeatures {\n        buildConfig true\n    }\n\n    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile releaseKeyFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'ir.myket:billing:2.2'
}
